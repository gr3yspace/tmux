# ==========================================
# TMUX CONFIGURATION
# ==========================================

# Enable mouse support
# Allows clicking panes, resizing, and scrolling
set -g mouse on

# Start window numbering at 1 instead of 0
set -g base-index 1

# Start pane numbering at 1 instead of 0
setw -g pane-base-index 1

# Renumber windows automatically when one closes
set -g renumber-windows on

# ==========================================
# PREFIX KEY
# ==========================================

# Change prefix from Ctrl+B to Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ==========================================
# QUALITY OF LIFE
# ==========================================

# Use vi-style navigation in copy mode
#setw -g mode-keys vi

# Enable automatic window naming
set -g automatic-rename on

# Allow more time to scroll through terminal history
set -g history-limit 50000

# Reduce delay after pressing Escape
set -sg escape-time 10

# Easier configuration reload
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Split panes using intuitive shortcuts
# Ctrl+A then | = vertical split (side by side)
#bind | split-window -h

# Ctrl+A then - = horizontal split (top/bottom)
#bind - split-window -v

# Navigate between panes using Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
